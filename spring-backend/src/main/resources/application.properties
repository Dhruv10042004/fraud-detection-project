spring.application.name=demo
server.port=${PORT:8080}

# ML Service base URL
app.ml.base-url=${APP_ML_BASE_URL:https://fraud-detection-project-gtlb.onrender.com}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,https://*.vercel.app}

# RestTemplate timeout (ms)
app.ml.connect-timeout=5000
app.ml.read-timeout=15000
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:safenet_fraud;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
