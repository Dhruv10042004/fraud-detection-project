spring.application.name=demo
server.port=${PORT:8080}

# ML Service base URL
app.ml.base-url=${APP_ML_BASE_URL:http://localhost:8000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# RestTemplate timeout (ms)
app.ml.connect-timeout=5000
app.ml.read-timeout=15000
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/safenet_fraud?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dhruv}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
